<!DOCTYPE html>
<html>
<head>
    <title>Update Ticket</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <h1>Update Ticket #{{ ticket['id'] }}</h1>

    <p><strong>Title:</strong> {{ ticket['title'] }}</p>
    <p><strong>Description:</strong> {{ ticket['description'] }}</p>
    <p><strong>Current Status:</strong> {{ ticket['status'] }}</p>

    <form method="POST">
        <label>New Status:</label><br>
        <select name="status">
            <option value="Pending" {% if ticket['status'] == 'Pending' %}selected{% endif %}>Pending</option>
            <option value="In Progress" {% if ticket['status'] == 'In Progress' %}selected{% endif %}>In Progress</option>
            <option value="Resolved" {% if ticket['status'] == 'Resolved' %}selected{% endif %}>Resolved</option>
        </select><br><br>

        <button type="submit">Update Status</button>
    </form>

    <br>
    <a href="{{ url_for('index') }}">Back to Ticket List</a>

</body>
</html>
